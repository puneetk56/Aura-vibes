<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Vibes | Positive Energy Store</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; }
    header { background: #1a1a1a; color: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: #fff; margin-left: 20px; text-decoration: none; font-weight: bold; }
    .hero { padding: 60px 20px; text-align: center; background: linear-gradient(120deg,#84fab0,#8fd3f4); }
    .hero h2 { font-size: 36px; }
    .products, .cart, .login { max-width: 1100px; margin: auto; padding: 40px 20px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(250px,1fr)); gap: 20px; }
    .product, .cart-item, .login-box { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { padding: 8px 14px; border: none; border-radius: 5px; cursor: pointer; background: #1a1a1a; color: #fff; }
    .hidden { display: none; }
    footer { background: #1a1a1a; color: #fff; text-align: center; padding: 15px; }
    input { width: 100%; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>

<header>
  <h1>Aura Vibes</h1>
  <nav>
    <a href="#" onclick="showSection('home')">Home</a>
    <a href="#" onclick="showSection('products')">Products</a>
    <a href="#" onclick="showSection('cart')">Cart (<span id="cartCount">0</span>)</a>
    <a href="#" onclick="showSection('login')">Login</a>
  </nav>
</header>

<section id="home" class="hero">
  <h2>Welcome to Aura Vibes ✨</h2>
  <p>Positive energy products to uplift your soul</p>
</section>

<section id="products" class="products hidden">
  <h2>Products</h2>
  <div class="product-grid">
    <div class="product">
      <h3>Crystal Bracelet</h3>
      <p>₹999</p>
      <button onclick="addToCart('Crystal Bracelet',999)">Add to Cart</button>
    </div>
    <div class="product">
      <h3>Aroma Candle</h3>
      <p>₹499</p>
      <button onclick="addToCart('Aroma Candle',499)">Add to Cart</button>
    </div>
    <div class="product">
      <h3>Healing Stone</h3>
      <p>₹799</p>
      <button onclick="addToCart('Healing Stone',799)">Add to Cart</button>
    </div>
  </div>
</section>

<section id="cart" class="cart hidden">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
</section>

<section id="login" class="login hidden">
  <h2>Login / Signup</h2>
  <div class="login-box">
    <input type="text" placeholder="Username" />
    <input type="password" placeholder="Password" />
    <button>Login</button>
  </div>
</section>

<footer>
  <p>© 2026 Aura Vibes</p>
</footer>

<script>
  let cart = [];

  function showSection(id) {
    document.querySelectorAll('section').forEach(sec => sec.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  function addToCart(name, price) {
    const item = cart.find(i => i.name === name);
    if (item) item.qty++;
    else cart.push({ name, price, qty: 1 });
    updateCart();
  }

  function removeItem(name) {
    cart = cart.filter(i => i.name !== name);
    updateCart();
  }

  function updateCart() {
    const cartDiv = document.getElementById('cartItems');
    cartDiv.innerHTML = '';
    let count = 0;

    cart.forEach(item => {
      count += item.qty;
      cartDiv.innerHTML += `
        <div class="cart-item">
          <h3>${item.name}</h3>
          <p>₹${item.price} x ${item.qty}</p>
          <button onclick="item.qty++; updateCart()">+</button>
          <button onclick="item.qty--; if(item.qty<=0) removeItem('${item.name}')">-</button>
          <button onclick="removeItem('${item.name}')">Remove</button>
        </div>`;
    });

    document.getElementById('cartCount').textContent = count;
  }
</script>

</body>
</html>
